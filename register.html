<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapidito — Crear cuenta</title><link rel="icon" href="./favicon.ico"><link rel="stylesheet" href="./src/styles/app.css"></head><body><main class="main"><section class="auth box"><div class="logo logo-auth"><img src="./src/assets/logo-full.png" alt="Rapidito"></div><h1>Crear cuenta</h1><p class="muted">Tu nueva cuenta empieza como cliente. No se selecciona ningún rol aquí.</p><form id="registerForm"><div class="field"><label>Nombre</label><input id="name" required autocomplete="name"></div><div class="field"><label>Correo</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="password" type="password" required minlength="6" autocomplete="new-password"></div><button class="btn primary" style="width:100%;padding:13px">Crear cuenta</button><div id="error" class="error"></div><div id="ok" class="ok"></div></form><p class="muted">¿Ya tienes cuenta? <a href="./login.html">Iniciar sesión</a></p><p class="muted auth-contact">¿Necesitas ayuda? <a href="tel:+18495732222">Llámanos al (849) 573-2222</a> <span class="muted">· o por <a href="https://wa.me/18495732222" target="_blank" rel="noopener">WhatsApp</a></span></p></section></main><script type="module">import {register} from './src/auth/register.js';import {watchSession} from './src/auth/auth-service.js';import {mensajeErrorAuth} from './src/shared/utils.js';const form=document.getElementById('registerForm'),error=document.getElementById('error'),ok=document.getElementById('ok');form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';ok.style.display='none';try{await register(name.value,email.value,password.value);ok.textContent='Cuenta creada. Entrando a Rapidito...';ok.style.display='block';setTimeout(()=>location.href='./app.html',500)}catch(err){error.textContent=mensajeErrorAuth(err.code);error.style.display='block'}});watchSession(session=>{if(session) location.href='./app.html'});</script></body></html>
