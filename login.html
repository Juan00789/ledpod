<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LEDPOD | Iniciar sesión</title>
	<link rel="stylesheet" href="./src/styles/app.css">
	<link rel="stylesheet" href="./src/styles/ledpod.css">
</head>
<body>
	<main class="main">
		<section class="auth box">
			<a class="logo logo-auth" href="./index.html" aria-label="Ledpod, inicio"><span class="brand-wordmark">LEDPOD</span></a>
			<h1>Bienvenido a Ledpod</h1>
			<p class="muted">Inicia sesión para entrar a tu espacio.</p>
			<form id="loginForm">
				<div class="field"><label for="email">Correo</label><input id="email" type="email" required autocomplete="email"></div>
				<div class="field"><label for="password">Contraseña</label><input id="password" type="password" required autocomplete="current-password"></div>
				<button class="btn primary" style="width:100%;padding:13px">Entrar</button>
				<div id="error" class="error" role="alert"></div>
				<div id="ok" class="ok" role="status"></div>
			</form>
			<p class="muted"><a href="#" id="forgotPassword">¿Olvidaste tu contraseña?</a></p>
			<p class="muted">¿No tienes cuenta? <a href="./register.html">Crear cuenta</a></p>
			<p class="muted auth-contact">¿Necesitas ayuda? <a href="tel:+18498865556">Llámanos al +1 849-886-5556</a> · <a href="https://wa.me/18498865556" target="_blank" rel="noopener">WhatsApp</a></p>
		</section>
	</main>
	<script type="module" src="./src/auth/login-page.js"></script>
</body>
</html>
