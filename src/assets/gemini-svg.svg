<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente para el texto LED -->
    <linearGradient id="ledGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>
    
    <!-- Gradiente para el texto POP -->
    <linearGradient id="popGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FFAB00" />
    </linearGradient>
  </defs>

  <!-- Silueta Superior (Cristo, Teleférico, Palmas y Montaña) -->
  <g fill="#FFFFFF">
    <!-- Base de la montaña -->
    <path d="M 50 70 Q 150 50, 250 55 T 450 70 L 450 75 L 50 75 Z" opacity="0.8"/>
    
    <!-- Cristo Redentor Centrado -->
    <path d="M 247 30 L 253 30 L 253 38 L 268 38 L 268 41 L 253 41 L 253 58 L 247 58 L 247 41 L 232 41 L 232 38 L 247 38 Z" />
    
    <!-- Cables y Cabina del Teleférico -->
    <path d="M 60 65 L 245 35" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M 255 35 L 440 65" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Cabina izquierda -->
    <rect x="130" y="52" width="10" height="8" rx="1" />
    <path d="M 135 48 L 135 52" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Palmas y Vegetación -->
    <!-- Palma Izquierda -->
    <path d="M 70 70 Q 68 55, 60 50 Q 70 52, 75 56 Q 78 50, 85 52 Q 80 58, 74 70 Z" />
    <!-- Palma Derecha -->
    <path d="M 430 70 Q 432 55, 440 50 Q 430 52, 425 56 Q 422 50, 415 52 Q 420 58, 426 70 Z" />
    
    <!-- Estrellas / Destellos de Luz -->
    <path d="M 100 35 L 102 40 L 107 42 L 102 44 L 100 49 L 98 44 L 93 42 L 98 40 Z" />
    <path d="M 390 30 L 391 34 L 395 35 L 391 36 L 390 40 L 389 36 L 385 35 L 389 34 Z" />
  </g>

  <!-- Texto Principal LEDPOP -->
  <g font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="78" letter-spacing="-1">
    <!-- LED en Blanco -->
    <text x="75" y="145" fill="url(#ledGrad)">LED</text>
    <!-- POP en Amarillo -->
    <text x="240" y="145" fill="url(#popGrad)">POP</text>
  </g>

  <!-- Límite Inferior y Subtítulo -->
  <g>
    <!-- Línea divisora izquierda -->
    <line x1="50" y1="165" x2="140" y2="165" stroke="#FFD600" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Texto de Subtítulo -->
    <text x="250" y="170" fill="#FFFFFF" font-family="'Arial', sans-serif" font-weight="bold" font-size="16" letter-spacing="3" text-anchor="middle">
      DECORACIONES &amp; LUCES
    </text>
    
    <!-- Línea divisora derecha -->
    <line x1="360" y1="165" x2="450" y2="165" stroke="#FFD600" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
